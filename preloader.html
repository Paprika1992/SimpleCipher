<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бриллиант из треугольников</title>
    <link rel="stylesheet" href="./preloader.css">
</head>
<body>
    <div class="container">
        <div class="diamond">
            <!-- Верхний ряд из 5 треугольников -->
            <div class="upper-row">
                <div class="triangle triangle-up triangle-block">
                    <div class='triangle-colored-text'></div>
                </div>
                <div class="triangle triangle-down triangle-block">
                    <div class='triangle-colored-text'></div>
                </div>
                <div class="triangle triangle-up triangle-block">
                    <div class='triangle-colored-text'></div>
                </div>
                <div class="triangle triangle-down triangle-block">
                    <div class='triangle-colored-text'></div>
                </div>
                <div class="triangle triangle-up triangle-block">
                    <div class='triangle-colored-text'></div>
                </div>
            </div>
            
            <!-- Центральный большой треугольник -->
            <div class="center-large triangle-block">
                <div class='triangle-colored-text'></div>
            </div>
            <div class="center-large-one-more triangle-block">
                <div class='triangle-colored-text'></div>
            </div>
            <div class="center-large-two-more triangle-block">
                <div class='triangle-colored-text'></div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./preloader.js"></script>
</body>
</html>
